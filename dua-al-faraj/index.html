function city(seed, base, minH, maxH, col, winP) {
  const r = rng(seed); let x = -20, d = '', wins = '';
  while (x < 1940) {
    const w = 50 + r() * 120, h = minH + r() * (maxH - minH);
    if (!(x > 330 && x < 790)) {
      d += `M${x.toFixed(0)} ${base}V${(base - h).toFixed(0)}h${w.toFixed(0)}V${base}Z`;
      if (r() < .22) { const cx = x + w / 2, rr = Math.min(w * .32, 26); d += `M${(cx - rr).toFixed(0)} ${(base - h).toFixed(0)}a${rr.toFixed(0)} ${(rr * 1.05).toFixed(0)} 0 0 1 ${(2 * rr).toFixed(0)} 0Z`; }
      for (let k = 0; k < 3; k++) if (r() < winP) {
        const wx = x + 10 + r() * (w - 24), wy = base - 12 - r() * (h - 24);
        wins += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="7" height="10" rx="2" fill="#ffc976"/>`;
      }
    }
    x += w + r() * 14;
  }
  return `<path d="${d}" fill="${col}"/><g opacity=".9">${wins}</g><g opacity=".55" filter="url(#b6)">${wins}</g>`;
}
function palm(x, base, h, col, lean = 0) {
  const top = [x + lean, base - h];

}

  /* ---------- hands and arms ---------- */
  /* A left hand, palm towards the viewer, fingers up; the wrist is at the origin and the thumb is on the outer (-x) side.

  function handSVG(skin, shade, col, ring) {
    /* a finger (or thumb) from its base, slightly narrower at the rounded tip */
    const digit = (bx, by, a, len, wb, wt) => {
      const r = a * Math.PI / 180, dx = Math.sin(r), dy = -Math.cos(r), nx = Math.cos(r), ny = Math.sin(r), rt = wt / 2;

    };

      ${ring ? `<g class="ring">
        <path d="M-0.6 -32.9 Q4.4 -30.4 9.4 -32.4" fill="none" stroke="#5f6670" stroke-width="3.6" stroke-linecap="butt"/>
        <path d="M-0.6 -32.9 Q4.4 -30.4 9.4 -32.4" fill="none" stroke="#dde2e8" stroke-width="2" stroke-linecap="butt"/>

  /* Rig: the shoulder is fixed; elbow, wrist and wrist bend come from blending poses. The upper arm hangs
     beside the body, the forearm comes up in front of the chest, and the hand continues the forearm's line. */
  const RIG = {
    boy:  { s: [-68, -204], wu: 30, wf: [28, 23], hs: 1.05, poses: {
      dua: { e: [-84, -112], w: [-42, -170], b: 24 }, wipe: { e: [-106, -172], w: [-50, -258], b: 30 }, lap: { e: [-92, -116], w: [-28, -72], b: 0 } } },

  function armSVG(p, side, fill, col, skin, shade, skinCol) {

      fore: `<path id="${id}FO" fill="${col}" stroke="${col}" stroke-width="8" stroke-linejoin="round"/><path id="${id}FF" fill="${fill}"/>

          const rx = R.wf[1] / 2, ry = rx * .42, len = 14 * R.hs + 4, hem = `M${-rx} 0 A${rx} ${ry} 0 0 0 ${rx} 0`;
          return `<g id="${id}Open"><ellipse rx="${rx}" ry="${ry}" fill="#24182c" stroke="${col}" stroke-width="2.5"/></g>

  const f1 = v => v.toFixed(1);
  const clamp01 = v => Math.min(1, Math.max(0, v));
  /* mix: {dua, wipe, lap} weights; opts: lift (px up), sway (-1..1), drop (0..1 slides the hands down the face in the wipe) */
  function poseArms(p, mix, opts = {}) {
    const R = RIG[p], k = R.poses, tot = (mix.dua || 0) + (mix.wipe || 0) + (mix.lap || 0) || 1;
    const blend = key => ['dua', 'wipe', 'lap'].reduce((a, n) => {
      const v = k[n][key], m = (mix[n] || 0) / tot;
      return Array.isArray(v) ? [a[0] + v[0] * m, a[1] + v[1] * m] : a + v * m;
    }, key === 'b' ? 0 : [0, 0]);
    const e = blend('e'), w = blend('w'), bend = blend('b');
    const lift = opts.lift || 0, sway = opts.sway || 0, rais = (mix.dua || 0) / tot, wipeW = (mix.wipe || 0) / tot;
    const drop = (opts.drop || 0) * wipeW * (p === 'dad' ? 70 : 52);
    for (const side of ['L', 'R']) {
      const sg = side === 'L' ? 1 : -1, id = p + 'Arm' + side, el = n => document.getElementById(id + n);
      const sx = R.s[0] * sg, sy = R.s[1];
      const ex = e[0] * sg + sway * 3, ey = e[1] - lift * .4 * rais;
      const wx = w[0] * sg + sway * 7, wy = w[1] - lift * rais + drop;
      /* upper arm */
      const up = `M${f1(sx)} ${f1(sy)} L${f1(ex)} ${f1(ey)}`;
      if (el('UO')) { el('UO').setAttribute('d', up); el('UF').setAttribute('d', up); }
      /* forearm: a sleeve that narrows from the elbow to the wrist, rounded at the elbow */
      const dx = wx - ex, dy = wy - ey, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
      const [w0, w1] = R.wf.map(v => v / 2);
      const quad = `M${f1(ex + nx * w0)} ${f1(ey + ny * w0)} L${f1(wx + nx * w1)} ${f1(wy + ny * w1)} L${f1(wx - nx * w1)} ${f1(wy - ny * w1)} L${f1(ex - nx * w0)} ${f1(ey - ny * w0)} Z`;
      const ball = `M${f1(ex - w0)} ${f1(ey)} a${f1(w0)} ${f1(w0)} 0 1 0 ${f1(2 * w0)} 0 a${f1(w0)} ${f1(w0)} 0 1 0 ${f1(-2 * w0)} 0Z`;
      el('FO').setAttribute('d', quad + ball); el('FF').setAttribute('d', quad + ball);
      /* the hand continues the forearm, with a small outward bend at the wrist */
      const theta = Math.atan2(dx, -dy) * 180 / Math.PI, rot = theta - (bend + sway * 4) * sg;
      el('Hand').setAttribute('transform', `translate(${f1(wx + ux * 3 * R.hs)} ${f1(wy + uy * 3 * R.hs)}) rotate(${f1(rot)})`);
      /* the sleeve opening sits across the end of the forearm; the wrist goes into it */
      const open = `translate(${f1(wx)} ${f1(wy)}) rotate(${f1(theta)})`;
      el('Open').setAttribute('transform', open); el('Lip').setAttribute('transform', open);
      const stone = el('Hand').querySelector('.stone');
    }
  }

  folA: $('pAFol'), folB: $('pBFol'), lanternGlass: $('lanternGlass'), lanternFlame: $('lanternFlame'), lanternHalo: $('lanternHalo'), dadPos: $('dadPos'), dadEyes: $('dadEyes'), dadEyesOpen: $('dadEyesOpen'), dadSmile: $('dadSmile'),
  boyPos: $('boyPos'), girlPos: $('girlPos'), boyHead: $('boyHead'), girlHead: $('girlHead'), dadHead: $('dadHead'),
  boyBody: $('boyBody'), girlBody: $('girlBody'), dadBody: $('dadBody'), boyArms: $('boyArms'), girlArms: $('girlArms'), dadArms: $('dadArms'),
  dadMouth: $('dadMouth'), title: $('title'), endcard: $('endcard'),
  brows: { boy: [$('boyBrowL'), $('boyBrowR')], girl: [$('girlBrowL'), $('girlBrowR')] },
  eyes: { boy: ['boyEyeL', 'boyEyeR'].map($), girl: ['girlEyeL', 'girlEyeR'].map($) },
  face: { boy: $('boyFace'), girl: $('girlFace') }

const BROW_PIV = { boy: [[-54, -332], [54, -332]], girl: [[-50, -332], [50, -332]] };

function blink(who, t) { let s = 1; for (const b of BLINKS[who]) { const d = Math.abs(t - b); if (d < .14) s = Math.min(s, .06 + d / .14 * .94); } return s; }
function mouth(id, open, t = 0) {
  const g = $(id), sm = g.querySelector('.smile'), op = g.querySelector('.open');
  at(sm, 'opacity', open < .1 ? 1 : 0); at(op, 'opacity', open < .1 ? 0 : 1);
  const vary = .12 * Math.sin(t * 11.3) + .06 * Math.sin(t * 17.9);  /* mouth shapes change as they speak */

}
function layer(e, p, cx, cy, z) {
  const zz = 1 + (z - 1) * p, x = 960 + (cx - 960) * p, y = 540 + (cy - 540) * p;
  at(e, 'transform', `translate(960 540) scale(${zz.toFixed(4)}) translate(${(-x).toFixed(2)} ${(-y).toFixed(2)})`);
}

function renderAt(t) {
  t = clamp(t, 0, DUR);
  const e = env(t);

  /* camera with parallax; the roof layer never shows past the painting's edges */

  cx = clamp(cx, 960 / z, 1920 - 960 / z); cy = clamp(cy, 540 / z, 1080 - 540 / z);
  layer(el.Lsky, .2, cx, cy, z); layer(el.Lfar, .45, cx, cy, z); layer(el.Llights, .35, cx, cy, z); layer(el.Lstorm, .35, cx, cy, z);
  layer(el.Lnear, .7, cx, cy, z); layer(el.Lroof, 1, cx, cy, z);

  /* sky: night, heavy, dawn */
  const heavy = track(HEAVY, t), dawn = track(DAWN, t), hope = track(HOPE, t);
  at(el.heavy, 'opacity', (heavy * .9).toFixed(3)); at(el.dawn, 'opacity', dawn.toFixed(3));
  at(el.starsG, 'opacity', ((1 - heavy * .85) * (1 - dawn)).toFixed(3));
  at(el.moon, 'opacity', ((1 - heavy * .7) * (1 - dawn * .8)).toFixed(3));
  el.stars.forEach((s, i) => { const S = starList[i]; at(s, 'opacity', (.55 + .45 * Math.sin(t * S.sp + S.ph)).toFixed(2)); });
  el.cl.forEach((c, i) => at(c, 'transform', `translate(${(t * (2 + i)).toFixed(1)} 0)`));
  at(el.Lstorm, 'opacity', (heavy * .95).toFixed(3));
  el.storm.forEach((s, i) => at(s, 'transform', `translate(${(STORM[i].d * Math.sin(t * .05 + i) + t * 3 * (i % 2 ? -1 : 1) % 1 + (1 - heavy) * (STORM[i].x < 960 ? -620 : 620)).toFixed(1)} ${((1 - heavy) * -40).toFixed(1)})`));
  at(el.hope, 'opacity', (hope * (.75 + .08 * Math.sin(t * 1.7))).toFixed(3));
  /* shooting stars */
  SHOOT.forEach((S, i) => {
    const u = (t - S.t) / .9, g = el.shoot[i];
    if (u < 0 || u > 1) { at(g, 'opacity', 0); return; }
    const hx = S.x + S.dx * u, hy = S.y + S.dy * u, len = Math.hypot(S.dx, S.dy), tx = hx - S.dx / len * 170, ty = hy - S.dy / len * 170;
    at(g, 'opacity', (Math.sin(u * Math.PI) * (1 - dawn)).toFixed(3));
    at(g.querySelector('.tail'), 'd', `M${tx.toFixed(1)} ${ty.toFixed(1)} L${hx.toFixed(1)} ${hy.toFixed(1)}`);
    at(g.querySelector('.head'), 'cx', hx.toFixed(1)); at(g.querySelector('.head'), 'cy', hy.toFixed(1));
  });
  /* wind in the hardship: the plants sway */
  const wind = heavy * (Math.sin(t * 2.3) * 5 + Math.sin(t * 3.7) * 2) + Math.sin(t * .9) * 1.2;
  at(el.folA, 'transform', `rotate(${wind.toFixed(2)} 0 -50)`); at(el.folB, 'transform', `rotate(${(wind * 1.1).toFixed(2)} 0 -50)`);
  /* the candle flickers */
  const fl = Math.sin(t * 13) * .5 + Math.sin(t * 29 + 1) * .3 + Math.sin(t * 7.3) * .2;
  at(el.lanternFlame, 'transform', `translate(0 -62) rotate(${(fl * 4).toFixed(2)}) scale(${(1 + fl * .07).toFixed(3)} ${(1 + fl * .1).toFixed(3)})`);
  at(el.lanternGlass, 'opacity', (.9 + fl * .08).toFixed(3));
  at(el.lanternHalo, 'opacity', ((.7 + fl * .15) * (1 - dawn * .6)).toFixed(3));
  at(el.shrineGlow, 'opacity', (.5 + .3 * clamp(track(LIGHTLVL, t)) * (1 - heavy) + .4 * hope).toFixed(3));

  /* the fourteen lights */
  const level = track(LIGHTLVL, t);
  let litSum = 0; const arcOp = [], arcSc = [];
  el.lights.forEach((g, i) => {
    const L = LIGHTS[i], a = smooth(L.t0, L.t0 + .7, t), back = smooth(80 + i * .45, 81 + i * .45, t);
    const lv = a * (t < 79 ? level : Math.max(level * back, .25));
    litSum += lv;
    const pulse = 1 + .06 * Math.sin(t * 2.1 + i);
    arcOp[i] = clamp(lv * (.9 + .1 * Math.sin(t * 3 + i * 1.7))); arcSc[i] = lerp(.3, 1, a) * pulse * (lv > 1 ? 1 + (lv - 1) * .6 : 1);
    at(g, 'opacity', arcOp[i].toFixed(3));
    at(g, 'transform', `translate(${L.x.toFixed(1)} ${(L.y + (1 - a) * 18).toFixed(1)}) scale(${arcSc[i].toFixed(3)})`);
  });
  /* two lights come down to shelter the family, then return */
  const down = easeSine(clamp((t - 133) / 6)) * (1 - easeSine(clamp((t - 164.6) / 6)));
  /* the lights live on a layer that moves differently with the camera; find where the arc lights sit on the roof layer */
  const zl = 1 + (z - 1) * .35, Xl = 960 + (cx - 960) * .35, Yl = 540 + (cy - 540) * .35;
  const onRoof = (x, y) => [cx + zl * (x - Xl) / z, cy + zl * (y - Yl) / z];
  PAIR.forEach((p, i) => {
    /* they travel sideways high in the sky and rise or sink only above their own spot, so they never pass over anyone's head */
    const k = i ? 7 : 6, [hx, hy] = onRoof(p.from.x, p.from.y), fx = easeSine(clamp(down / .7)), fy = easeSine(clamp((down - .3) / .7));
    const x = lerp(hx, p.to.x, fx) + Math.sin(t * .8 + i) * 6 * down, y = lerp(hy, p.to.y, fy) + Math.sin(t * 1.1 + i * 2) * 8 * down;
    const kick = 1 + .25 * (bump(149.8, 150.3, 151, 152.5, t) + bump(159.7, 160.2, 161, 162.5, t));
    const sc = lerp(arcSc[k] * zl / z, 1.5 * kick, down);
    at(el.pair[i], 'opacity', (down > .002 ? lerp(arcOp[k], 1, clamp(down * 4)) : 0).toFixed(3));
    at(el.pair[i], 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
  });
  el.lights[6].style.visibility = el.lights[7].style.visibility = down > .002 ? 'hidden' : 'visible';
  at(el.shelter, 'opacity', (down * (.32 + .06 * Math.sin(t * 2))).toFixed(3));
  at(el.motesG, 'opacity', down.toFixed(3));
  if (down > 0) MOTES.forEach((m, i) => {
    const a = m.a + t * m.sp, x = 1260 + Math.cos(a) * m.rx, y = 640 + Math.sin(a) * m.ry * .6 + Math.sin(t * 1.3 + m.bob) * 18;
    at(el.motes[i], 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(m.s * (.8 + .2 * Math.sin(t * 3 + m.bob))).toFixed(3)})`);
  });
  at(el.noor, 'opacity', (clamp(litSum / 14, 0, 1.3) * .18 + hope * .12).toFixed(3));
  at(el.lantern, 'opacity', ((.33 + .03 * Math.sin(t * 9) + .02 * Math.sin(t * 23)) * (1 - dawn * .7)).toFixed(3));
  at(el.vignette, 'opacity', (1 - dawn * .5).toFixed(3));

  at(el.dip, 'opacity', dip(t).toFixed(3));

  /* city lamps on the repeated words */
  const rep = DUA.filter(L => L.join === 2).flatMap(L => L.k);
  /* the cat: asleep (with little z's) until the lanterns start, then watches them; looks up at the birds at dawn */
  Chars.poseCat(t, smooth(177, 178.4, t), smooth(213.5, 215, t));
  el.lamps.forEach((g, i) => { const a = smooth(rep[i] - .05, rep[i] + .35, t); at(g, 'opacity', (a * (1 - dawn * .6)).toFixed(3)); at(g, 'transform', `translate(0 -11) scale(${(1 + .35 * bump(rep[i], rep[i] + .2, rep[i] + .4, rep[i] + 1, t)).toFixed(3)}) translate(0 11)`); });

  /* the family */
  const worry = track(WORRY, t), lift = track(LIFT, t), [up, sideG, sideB] = track(LOOK, t), join = joinAt(t);
  const side = { girl: sideG, boy: sideB }, happy = { girl: track(HAPPY_G, t), boy: track(HAPPY_B, t) };
  const br = (p, ph) => 1 + .008 * Math.sin(t * 2 * Math.PI / p + ph);
  at(el.dadBody, 'transform', `scale(1 ${br(4.2, 0).toFixed(4)})`);
  at(el.boyBody, 'transform', `scale(1 ${br(3.3, 1).toFixed(4)})`);
  at(el.girlBody, 'transform', `scale(1 ${br(3.0, 2).toFixed(4)})`);
  /* hands: in the lap at the start, raised in dua, wiping the face at the end, then resting */
  const lapW = track(LAPW, t), wipeW = track(WIPEW, t), drop = smooth(219.1, 220.3, t);
  const mixFor = start => { const l = Math.max(lapW, 1 - start), w = wipeW * (1 - l); return { lap: l, wipe: w, dua: Math.max(0, 1 - l - w) }; };
  Chars.poseArms('dad', mixFor(smooth(1.2, 2.6, t)), { lift: lift * 14, sway: Math.sin(t * .8) * .5, drop });
  Chars.poseArms('girl', mixFor(smooth(2.4, 3.6, t)), { lift: lift * 24, sway: Math.sin(t * .9 + 1) * .6, drop });
  Chars.poseArms('boy', mixFor(smooth(2.8, 4.0, t)), { lift: lift * 24, sway: Math.sin(t * .85 + 2) * .6, drop });
  /* the father rocks gently as he recites and nods at the end of each line */
  let nod = 0; for (const L of DUA) nod = Math.max(nod, bump(L.end - .1, L.end + .25, L.end + .45, L.end + 1, t));
  at(el.dadPos, 'transform', `translate(1260 1000) rotate(${(Math.sin(t * 1.9) * .7 * (1 - lapW)).toFixed(3)})`);
  /* worried children lean in towards their father; everyone sways a little */
  at(el.girlPos, 'transform', `translate(${(960 + worry * 16).toFixed(1)} 1032) rotate(${(Math.sin(t * 1.3) * .6 + worry * 1.5).toFixed(3)}) scale(.95)`);
  at(el.boyPos, 'transform', `translate(${(1560 - worry * 16).toFixed(1)} 1032) rotate(${(Math.sin(t * 1.2 + 1) * .6 - worry * 1.5).toFixed(3)}) scale(.95)`);
  const tilt = (who, deg, ph) => at(el[who + 'Head'], 'transform', `translate(0 ${(-(br(3.2, ph) - 1) * 220).toFixed(2)}) rotate(${(deg + Math.sin(t * .75 + ph) * 1.6).toFixed(2)} 0 -236)`);
  tilt('girl', 2 + worry * 5 + side.girl * 3 + happy.girl * 4, 0); tilt('boy', -2 - worry * 5 + side.boy * 3 - happy.boy * 4, 1);
  const endOpen = smooth(220.6, 221.2, t);
  at(el.dadHead, 'transform', `rotate(${(Math.sin(t * .9) * 1.4 + e * 1.2 + endOpen * Math.sin(t * .6) * 3).toFixed(2)} 0 -410) translate(0 ${(worry * 4 + nod * 7 - (join === 2 ? 3 : 0)).toFixed(1)})`);
  /* at the very end the father opens his eyes and smiles at his children */
  at(el.dadEyes, 'opacity', (1 - endOpen).toFixed(3)); at(el.dadEyesOpen, 'opacity', endOpen.toFixed(3)); at(el.dadSmile, 'opacity', endOpen.toFixed(3));
  el.dadEyesOpen.querySelectorAll('.look').forEach(g => at(g, 'transform', `translate(${(Math.sin(t * .6) * 3.5).toFixed(2)} 1.5)`));
  for (const who of ['boy', 'girl']) {
    at(el.face[who], 'transform', `translate(${(side[who] * 4).toFixed(2)} ${(-up * 5 + worry * 3).toFixed(2)})`);
    el.eyes[who].forEach(g => {
      at(g.querySelector('.look'), 'transform', `translate(${(side[who] * 4.5).toFixed(2)} ${(-up * 6 + 1.5).toFixed(2)})`);
      const h = happy[who], open = blink(who, t) * (1 - worry * .1) * (1 - h), shut = open < .3;
      at(g.querySelector('.lidscale'), 'transform', `scale(1 ${Math.max(.3, open).toFixed(3)})`);
      at(g.querySelector('.lidscale'), 'opacity', shut ? 0 : 1);
      at(g.querySelector('.happy'), 'opacity', shut && h >= .5 ? 1 : 0);
      at(g.querySelector('.closed'), 'opacity', shut && h < .5 ? 1 : 0);
    });
    const [bl, brw] = el.brows[who], [pl, pr] = BROW_PIV[who];
    at(bl, 'transform', `rotate(${(-worry * 12 + happy[who] * 4).toFixed(2)} ${pl[0]} ${pl[1]})`);
    at(brw, 'transform', `rotate(${(worry * 12 - happy[who] * 4).toFixed(2)} ${pr[0]} ${pr[1]})`);
  }
  /* mouths: the father recites; the children join in on the salawat and the repeated words */
  at(el.dadMouth, 'ry', (1.5 + e * 7).toFixed(2)); at(el.dadMouth, 'rx', (9 + e * 2).toFixed(2)); at(el.dadMouth, 'opacity', (1 - endOpen).toFixed(3));
  const kid = join ? e * (join === 2 ? 1 : .7) : 0;
  const wonder = bump(10.6, 11.4, 13.5, 14.5, t) * .5 + bump(84.5, 85.3, 87, 88, t) * .4 + bump(133.5, 134.3, 136, 137, t) * .5;
  mouth('boyMouth', Math.max(kid * .85, (1 - (join ? 1 : 0)) * wonder * .8), t);
  mouth('girlMouth', Math.max(kid * .8, (1 - (join ? 1 : 0)) * wonder), t + 1.7);

  /* sparks rise from the children's hands while they make dua */
  SPARKS.forEach((s, i) => {
    const g = el.sparks[i], tt = s.t0 < 78 ? s.t0 : s.t0 + 100, age = (t - tt) / s.life;
    if (age < 0 || age > 1) { at(g, 'opacity', 0); return; }
    const ox = s.who ? 1560 - worry * 16 : 960 + worry * 16, oy = 1032 - 230 - lift * 23;
    at(g, 'transform', `translate(${(ox + s.dx * age + Math.sin(age * 6 + s.wob) * 14).toFixed(1)} ${(oy + s.dy * age).toFixed(1)}) scale(${s.s.toFixed(2)})`);

  });

  /* dawn: rain, flowers, birds */
  const rainA = bump(209, 210.5, 214, 216, t);
  at(el.rainG, 'opacity', rainA.toFixed(3));
  if (rainA > 0) el.rain.forEach((r, i) => { const d = RAIN[i], y = (d.y + t * d.sp) % 1180 - 60; at(r, 'transform', `translate(${(d.x - y * .2).toFixed(1)} ${y.toFixed(1)})`); });
  el.sprouts.forEach((g, i) => { const a = smooth(SPROUTS[i].t0, SPROUTS[i].t0 + .8, t); at(g, 'transform', `translate(${SPROUTS[i].x.toFixed(0)} 801) scale(${(a * SPROUTS[i].s * (1 + .15 * Math.sin(a * 3.14))).toFixed(3)})`); });
  el.blooms.forEach((g, i) => { const a = smooth(213 + i * .35, 214 + i * .35, t); const tr = g.getAttribute('transform').replace(/scale\([^)]*\)/, `scale(${a.toFixed(3)})`); at(g, 'transform', tr); });
  const birdA = smooth(213.5, 214.5, t);
  at(el.birdsG, 'opacity', birdA.toFixed(3));
  if (birdA > 0) el.birds.forEach((b, i) => {
    const B = BIRDS[i], x = B.x0 - (t - 213.5) * B.sp * 2.2, f = Math.sin(t * 9 + B.ph) * 9, s = B.s;
    at(b, 'd', `M${(x - 16 * s).toFixed(1)} ${(B.y + 2).toFixed(1)} Q${(x - 8 * s).toFixed(1)} ${(B.y - f * s).toFixed(1)} ${x.toFixed(1)} ${B.y} Q${(x + 8 * s).toFixed(1)} ${(B.y - f * s).toFixed(1)} ${(x + 16 * s).toFixed(1)} ${(B.y + 2).toFixed(1)}`);
  });

  el.title.style.opacity = (bump(-1, 0, 1.6, 2.5, t)).toFixed(3);
  el.endcard.style.opacity = smooth(221.2, 222.4, t).toFixed(3);
  DUA.forEach((L, i) => {
    const [a, b] = lineShow[i], vis = smooth(a, a + .45, t) * (1 - smooth(b, b + .35, t));
    lineEls[i].style.opacity = vis.toFixed(3);
    lineEls[i].style.transform = `translateY(${((1 - vis) * .6).toFixed(3)}cqw)`;
    if (vis <= 0) return;
    lineWords[i].forEach(w => {
      const k = +w.dataset.k, s0 = L.k[k], s1 = L.k[k + 1] ?? L.end;

}
window.renderAt = renderAt;

/* ---------- playback ---------- */
const aud = $('aud'), stage = $('stage'), playover = $('playover'), toggle = $('toggle'), icon = $('toggleIcon'), scrub = $('scrub'), clock = $('clock');
const PLAY = 'M7 4.5v15l13-7.5z', PAUSE = 'M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z';
let playing = false, started = false, clockStart = 0, clockT = 0, useAudio = true, idleTimer = 0;
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function show(t) { renderAt(t); scrub.value = t.toFixed(2); clock.textContent = `${fmt(t)} / ${fmt(DUR)}`; }
const now = () => useAudio && !aud.paused ? aud.currentTime : clockT + (performance.now() - clockStart) / 1000;

function setIcon() { icon.setAttribute('d', playing ? PAUSE : PLAY); toggle.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
function play(from) {
  clockT = from >= DUR - .1 ? 0 : from; playing = true; started = true; playover.hidden = true; setIcon();
  clockStart = performance.now(); aud.currentTime = clockT;

  requestAnimationFrame(frame); wake();
}
function stop() { clockT = now(); playing = false; aud.pause(); setIcon(); wake(); }
function togglePlay() { playing ? (stop(), show(clockT)) : play(started ? +scrub.value : 0); }
/* the controls hide while the film plays and come back when the viewer moves or taps */
function wake() {
  stage.classList.remove('idle'); clearTimeout(idleTimer);
  if (playing) idleTimer = setTimeout(() => stage.classList.add('idle'), 2500);
}
$('playbtn').addEventListener('click', ev => { ev.stopPropagation(); play(0); });
toggle.addEventListener('click', ev => { ev.stopPropagation(); togglePlay(); });
$('hud').addEventListener('click', ev => ev.stopPropagation());
stage.addEventListener('click', () => { if (stage.classList.contains('idle')) { wake(); return; } if (started) togglePlay(); });
stage.addEventListener('pointermove', wake);
stage.addEventListener('touchstart', wake, { passive: true });
scrub.addEventListener('input', () => { const t = +scrub.value; started = true; playover.hidden = true; if (playing) { aud.currentTime = t; clockT = t; clockStart = performance.now(); } else { clockT = t; show(t); } wake(); });
const full = $('full');
if (!document.fullscreenEnabled) full.hidden = true;
/* full screen takes the whole page, not the stage: a stage made full screen is stretched to the screen's shape and the
   picture cropped (an upright phone showed a narrow slice). The page keeps the 16:9 film whole on black, and where the
   browser allows it (Android phones) the picture also turns sideways, as video players do. */
full.addEventListener('click', ev => {
  ev.stopPropagation();
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  document.documentElement.requestFullscreen()
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
    .catch(() => {});
});

  if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) try { screen.orientation.unlock(); } catch (e) { /* nothing was locked */ }

document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input, a')) return;
  if (ev.key === ' ' || ev.key === 'k') { ev.preventDefault(); started ? togglePlay() : play(0); }
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
    const t = clamp((playing ? now() : clockT) + (ev.key === 'ArrowRight' ? 5 : -5), 0, DUR);

window.__stillMode = () => { playover.hidden = true; };
/* local review: ?t=SECONDS opens a still at that moment */
const qt = /[?&]t=([\d.]+)/.exec(location.search);
if (qt) { playover.hidden = true; $('hud').hidden = true; clockT = +qt[1]; }
show(qt ? +qt[1] : 1.2);
})();
</script>
