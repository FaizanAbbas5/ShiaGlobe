<body>
<title>How Do You Wrap a Kindness?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* The book reader shared by the Kumayl & Fizza books. Each book supplies PAGES and its art (the BOOK script slot).
   Layout: nothing but the book on a lilac cloth. It starts closed on its front cover, opens to two facing pages
   that turn over at the spine, and shows one page at a time where two would be too small to read. */
:root {
  --cloth: #d9d3e6; --cloth-deep: #c7bedb; --muted: #5b5370; --edge: #ebe2d1; --edge-deep: #c8bba5;
  --shadow: rgba(38, 24, 66, .34); --focus: #2f62d0;
  --read: 'Andika', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cloth: #1d1a34; --cloth-deep: #15122a; --muted: #aaa2c6; --edge: #ddd3c1; --edge-deep: #a99c86;
    --shadow: rgba(0, 0, 0, .6); --focus: #9fc1ff; color-scheme: dark; }
}
:root[data-theme="dark"] { --cloth: #1d1a34; --cloth-deep: #15122a; --muted: #aaa2c6; --edge: #ddd3c1; --edge-deep: #a99c86;
  --shadow: rgba(0, 0, 0, .6); --focus: #9fc1ff; color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(ellipse at 50% 45%, var(--cloth), var(--cloth-deep) 95%); background-color: var(--cloth); color: var(--muted); font-family: var(--read); }
.app { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-block: 20px; padding-inline: 16px; }

/* the book */
.stage { position: relative; width: 100%; display: flex; justify-content: center; overflow-x: clip; }
.book { position: relative; width: var(--bookw); height: var(--ph); perspective: calc(var(--pw) * 6); }
.book.closed { transform: translateX(-25%); }
.slot { position: absolute; top: 0; width: var(--pw); height: 100%; cursor: pointer; }
.slot.empty { visibility: hidden; }
.slot.l { left: 0; box-shadow: -1px 1px 0 var(--edge), -3px 2px 0 var(--edge-deep), -4px 3px 0 var(--edge), -6px 4px 0 var(--edge-deep), 0 22px 40px -14px var(--shadow); }
.slot.r { right: 0; box-shadow: 1px 1px 0 var(--edge), 3px 2px 0 var(--edge-deep), 4px 3px 0 var(--edge), 6px 4px 0 var(--edge-deep), 0 22px 40px -14px var(--shadow); }
/* the fold at the spine: each page darkens a little towards it (sL: the spine is on the page's left, sR: on its right) */
.fold { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.fold.sL { background: linear-gradient(to right, rgba(28, 16, 40, .34), rgba(28, 16, 40, .1) 2.5%, rgba(255, 255, 255, .06) 5%, transparent 9%); }
.fold.sR { background: linear-gradient(to left, rgba(28, 16, 40, .34), rgba(28, 16, 40, .1) 2.5%, rgba(255, 255, 255, .06) 5%, transparent 9%); }
/* closed, the front cover shows the hinge of the binding; one page at a time, just a faint edge */
.book.closed .slot.r .fold { background: linear-gradient(to right, rgba(0, 0, 0, .38), rgba(255, 255, 255, .14) 1.1%, rgba(0, 0, 0, .12) 2.2%, transparent 3.5%); }
.book.single .fold.sL { background: linear-gradient(to right, rgba(28, 16, 40, .22), transparent 3%); }
/* a page while it turns */
.leaf { position: absolute; top: 0; width: var(--pw); height: 100%; transform-style: preserve-3d; z-index: 5; pointer-events: none; }
.leaf.fwd { right: 0; transform-origin: left center; }
.book.single .leaf.fwd { left: 0; right: auto; }
.leaf.bwd { left: 0; transform-origin: right center; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: #f6efe2; }
.face.b { transform: rotateY(180deg); }
.dim { position: absolute; inset: 0; background: #140a22; opacity: 0; pointer-events: none; z-index: 3; }

/* one page of the book: the picture fills it; the text sits on a paper panel inside the picture */
.page { position: absolute; inset: 0; overflow: hidden; container-type: inline-size; background: #f6efe2; }
.page svg, .page img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.text { position: absolute; box-sizing: border-box; background: #fff8ea; color: #2b2240; border-radius: 1.4cqw; padding: 2.2cqw 2.4cqw;
  box-shadow: 0 .4cqw 1.4cqw rgba(30, 15, 50, .28); font-size: 1.9cqw; line-height: 1.48; font-family: var(--read); }
.text p { margin: 0 0 .7em; text-wrap: pretty; break-inside: avoid; }
.text p:last-child { margin-bottom: 0; }
.said { color: #6b2f6f; }
.big { font-weight: 700; color: #1f4f96; }
.blank { position: absolute; inset: 0; background: #f6efe2; }

/* faint arrows either side of the book; pages also turn by clicking or tapping them, swiping, or the arrow keys */
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 72px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; opacity: .5; transition: opacity .2s; }
.nav svg { width: 28px; height: 28px; }
.nav:hover, .nav:focus-visible { opacity: 1; }
.nav:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.nav.prev { left: 0; } .nav.next { right: 0; }
.nav:disabled { visibility: hidden; }
body.small .nav { display: none; }
/* faint switches in the corner: one page at a time for bigger text (shown only where two pages fit), and full screen
   (F key too; hidden where the browser can't go full screen). Each icon shows what it switches to. */
.tools { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 10px; display: flex; z-index: 10; }
.tool { width: 40px; height: 40px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; opacity: .45; transition: opacity .2s; }
.tool svg { width: 22px; height: 22px; }
.fs .off, body.fullscreen .fs .on { display: none; } body.fullscreen .fs .off { display: inline; }
.view .two, body.one-page .view .one { display: none; } body.one-page .view .two { display: inline; }
.tool:hover, .tool:focus-visible { opacity: 1; }
.tool:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
body.sheet .tools { display: none !important; }
/* small screens: the text goes under the page, on the same paper */
.phone-text { width: 100%; max-width: var(--bookw); box-sizing: border-box; background: #fff8ea; color: #2b2240; border-radius: 4px; padding: 14px 18px; font-size: 1.1rem; line-height: 1.55; box-shadow: 0 10px 24px -14px var(--shadow); }
.phone-text p { margin: 0 0 .65em; } .phone-text p:last-child { margin: 0; }
body.small .page .text { display: none; }
/* the maker's credit: faint, in the bottom corner, like the credits in the Dua al-Faraj film's controls. The book is
   sized to leave room for it (layout); on small screens, where the page scrolls, it follows the text instead. */
.credit { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 10; font-size: 13px; color: var(--muted); opacity: .8; text-decoration: none; transition: opacity .2s; }
.credit:hover, .credit:focus-visible { opacity: 1; text-decoration: underline; }
.credit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
body.small .credit { position: static; align-self: flex-end; }
/* small screens held sideways: the text sits beside the page, in a column that scrolls */
body.side .app { flex-direction: row; }
body.side .stage { width: auto; flex: none; }
body.side .phone-text { width: auto; flex: 0 1 400px; max-width: none; max-height: var(--ph); overflow-y: auto; }
body.side .credit { position: fixed; }

/* sheet mode (#sheet-<page>): one page filling the window, used to render the print files */
body.sheet .app { padding: 0; display: block; }
body.sheet .stage, body.sheet .phone-text, body.sheet .credit { display: none !important; }
.sheet-page { position: relative; width: 100vw; aspect-ratio: 1600 / 1131; }
/* print: one page per landscape A4 sheet */
.printset { display: none; }
@media print {
  @page { size: A4 landscape; margin: 0; }
  body { background: #fff; }
  .app { padding: 0; display: block; }
  .stage, .phone-text, .tools, .credit { display: none !important; }
  .printset { display: block !important; }
  .printset .sheet-page { width: 297mm; height: 210mm; aspect-ratio: auto; break-after: page; }
}
</style>

<div class="app">
  <div class="tools">
    <button class="tool view" id="view" type="button" aria-label="One page at a time" title="One page at a time" hidden>
      <svg class="one" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <svg class="two" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h18v10H3zM12 7.5v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool fs" id="fs" type="button" aria-label="Full screen" title="Full screen (F)" hidden>
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="stage">
    <button class="nav prev" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="book closed" id="book" aria-live="polite">
      <div class="slot l" id="slotL"></div>
      <div class="slot r" id="slotR"></div>
    </div>
    <button class="nav next" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="phone-text" id="phoneText" hidden></div>
  <a class="credit" id="credit" href="https://www.linkedin.com/in/faizan-abbas-b774a2217/" target="_blank" rel="noopener">by Faizan Abbas</a>
  <div class="printset" id="printset"></div>
</div>

<script>
/* Kumayl, Fizza and the Jar of Lights: drawing toolkit and characters.
   Painted-storybook look: no outlines, shapes modelled with soft shadow, warm key light, cool rim light, paper grain.
   Everything returns SVG strings. Characters are drawn around a local origin and placed with translate/scale. */
(function () {
  let uid = 0;
  const nid = p => p + (++uid);
  const f = v => (Math.round(v * 10) / 10).toString();
  const pt = p => f(p[0]) + ' ' + f(p[1]);

  /* ---------- geometry ---------- */
  function cubic(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
            u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
  }
  /* A tapered brush stroke along one cubic: width w0 at the start, wm in the middle, w1 at the end. */
  function brush(c, w0, wm, w1, fill, extra = '') {
    const N = 26, L = [], R = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, p = cubic(c[0], c[1], c[2], c[3], t);
      const a = cubic(c[0], c[1], c[2], c[3], Math.max(0, t - .01)), b = cubic(c[0], c[1], c[2], c[3], Math.min(1, t + .01));
      let dx = b[0] - a[0], dy = b[1] - a[1]; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const w = (t < .5 ? w0 + (wm - w0) * (t / .5) * (2 - t / .5) : wm + (w1 - wm) * ((t - .5) / .5) ** 2) / 2;
      L.push([p[0] - dy * w, p[1] + dx * w]); R.push([p[0] + dy * w, p[1] - dx * w]);
    }
    return `<path d="M${L.map(pt).join(' L')} L${R.reverse().map(pt).join(' L')} Z" fill="${fill}" ${extra}/>`;
  }
  /* soft shading: blurred shapes clipped to a region */
  function soft(clipD, shapes, blur, extra = '') {
    const id = nid('sc');
    return `<clipPath id="${id}"><path d="${clipD}"/></clipPath><g clip-path="url(#${id})" ${extra}><g filter="url(#blur${blur})">${shapes}</g></g>`;
  }
  /* rim light: the part of a shape that is not covered by the same shape shifted by (dx, dy) */
  function rim(d, dx, dy, fill, op = 1, blur = 0) {
    const id = nid('rm');
    return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="8000" height="8000"><path d="${d}" fill="#fff"/><path d="${d}" transform="translate(${dx} ${dy})" fill="#000"/></mask>
      <g mask="url(#${id})"><path d="${d}" fill="${fill}" opacity="${op}" ${blur ? `filter="url(#blur${blur})"` : ''}/></g>`;
  }
  /* colour line: the same shapes drawn fat in a darker tone, under the fills, so only the silhouette shows as a thin line */
  const hold = (svg, col, lw = 2.4) => svg.replace(/ opacity="[^"]*"/g, '').replace(/fill="[^"]*"/g, `fill="${col}" stroke="${col}" stroke-width="${2 * lw}" stroke-linejoin="round"`);

  /* ---------- palette ---------- */
  const C = {
    skin: '#f3c39c', skinSh: '#d99a78', skinDeep: '#b9725a', skinHi: '#ffe3c8', blush: '#f08d80',
    lid: '#3a2219', iris: '#5a3420', irisDeep: '#2a140b', white: '#fffaf3',
    mouth: '#7c2a26', tongue: '#e8746d', teeth: '#fffaf3',
    hair: '#2a1b16', hairSh: '#170e0b', hairHi: '#5e4436',
    scarf: '#b8a1e6', scarfSh: '#8a72c8', scarfDeep: '#6a54a8', scarfHi: '#e3d8fb', cap: '#fbf6ff',
    dress: '#f2919a', dressSh: '#cf6c80', dressDeep: '#a84f66',
    tunic: '#4f9fd6', tunicSh: '#3478ae', tunicDeep: '#24598a', tunicHi: '#9ccff0',
    skinLine: '#b56f56', hairLine: '#0e0806', scarfLine: '#62489c', dressLine: '#a14a64', tunicLine: '#1f4f80',
    warm: '#ffc670', warmCloth: '#ffb08a', warmHot: '#ffe6a8', moon: '#cfe0ff'
  };

  /* ---------- faces (3/4 view, facing right; mirror for left) ---------- */
  /* An eye: almond white, glossy iris that looks toward (lx, ly), tapered upper lash line.
     near = 1 for the eye closer to the viewer, smaller values squeeze it for the far side. */
  function eye(x, y, s, near, look, lashes, opts = {}) {
    const rx = 23 * s * near, ry = 27 * s, cid = nid('ey');
    const white = `M${f(x - rx)} ${f(y + 2)} C${f(x - rx)} ${f(y - ry * .9)} ${f(x - rx * .35)} ${f(y - ry)} ${f(x + rx * .1)} ${f(y - ry)} C${f(x + rx * .75)} ${f(y - ry)} ${f(x + rx)} ${f(y - ry * .55)} ${f(x + rx)} ${f(y + 2)} C${f(x + rx)} ${f(y + ry * .8)} ${f(x + rx * .45)} ${f(y + ry)} ${f(x)} ${f(y + ry)} C${f(x - rx * .5)} ${f(y + ry)} ${f(x - rx)} ${f(y + ry * .8)} ${f(x - rx)} ${f(y + 2)} Z`;
    const ix = x + look[0] * rx * .42, iy = y + 3 * s + look[1] * ry * .3, ir = 18.5 * s;
    if (opts.closed) {
      return brush([[x - rx - 2, y + 2], [x - rx * .4, y + ry * .55], [x + rx * .4, y + ry * .55], [x + rx + 2, y]], 2, 6 * s, 2.5, C.lid);
    }
    const out = [];
    out.push(`<clipPath id="${cid}"><path d="${white}"/></clipPath>`);
    out.push(`<path d="${white}" fill="${C.white}"/>`);
    out.push(`<g clip-path="url(#${cid})">
      <ellipse cx="${f(ix)}" cy="${f(iy)}" rx="${f(ir * Math.max(.72, near))}" ry="${f(ir * 1.08)}" fill="url(#irisG)"/>
      <ellipse cx="${f(ix)}" cy="${f(iy + 1)}" rx="${f(ir * .5 * Math.max(.72, near))}" ry="${f(ir * .55)}" fill="${C.irisDeep}"/>
      <path d="${white}" fill="none" stroke="${C.lid}" stroke-opacity=".18" stroke-width="${f(10 * s)}" transform="translate(0 ${f(-5 * s)})"/>
      <ellipse cx="${f(x)}" cy="${f(y - ry * .95)}" rx="${f(rx * 1.1)}" ry="${f(ry * .42)}" fill="${C.lid}" opacity=".16"/>
    </g>`);
    out.push(`<circle cx="${f(ix - ir * .38)}" cy="${f(iy - ir * .42)}" r="${f(ir * .34)}" fill="#fff"/>`);
    out.push(`<circle cx="${f(ix + ir * .35)}" cy="${f(iy + ir * .38)}" r="${f(ir * .14)}" fill="#fff" opacity=".9"/>`);
    /* upper lid line, heaviest towards the outer corner */
    const outer = opts.outerLeft ? -1 : 1;
    const a = [x - rx * outer - 3 * outer, y + 4], b = [x + rx * outer + 1 * outer, y - 2];
    const lid = outer > 0
      ? [[x - rx - 2, y + 1], [x - rx * .7, y - ry * 1.12], [x + rx * .6, y - ry * 1.16], [x + rx + 4, y - ry * .2]]
      : [[x + rx + 2, y + 1], [x + rx * .7, y - ry * 1.12], [x - rx * .6, y - ry * 1.16], [x - rx - 4, y - ry * .2]];
    out.push(brush(lid, 2.5 * s, 7.5 * s, 5.5 * s, C.lid));
    if (lashes) {
      const e = lid[3], d = outer;
      out.push(brush([[e[0] - 4 * d, e[1] + 2], [e[0] + 2 * d, e[1] - 3], [e[0] + 7 * d, e[1] - 6], [e[0] + 11 * d, e[1] - 12]], 5 * s, 3.4 * s, 1, C.lid));
      out.push(brush([[e[0] - 10 * d, e[1] - 6], [e[0] - 7 * d, e[1] - 11], [e[0] - 4 * d, e[1] - 15], [e[0] - 1 * d, e[1] - 21]], 4.4 * s, 3 * s, 1, C.lid));
    }
    /* lower lid hint */
    out.push(brush([[x - rx * .55, y + ry * .98], [x - rx * .2, y + ry * 1.08], [x + rx * .2, y + ry * 1.08], [x + rx * .55, y + ry * .96]], 1, 2.4 * s, 1, C.skinDeep, 'opacity=".45"'));
    return out.join('');
  }

  /* mouths for a 3/4 face, centre (x, y); the far side is on the right */
  function mouth(x, y, s, kind) {
    if (kind === 'smile') {
      return brush([[x - 24 * s, y - 5 * s], [x - 13 * s, y + 11 * s], [x + 8 * s, y + 12 * s], [x + 17 * s, y - 3 * s]], 2, 5.6 * s, 2, C.mouth) +
        brush([[x - 27 * s, y - 9 * s], [x - 26 * s, y - 6 * s], [x - 25 * s, y - 4 * s], [x - 23 * s, y - 3 * s]], 1, 3 * s, 1, C.mouth, 'opacity=".6"');
    }
    /* open, delighted */
    const cid = nid('mo');
    const o = `M${f(x - 25 * s)} ${f(y - 7 * s)} C${f(x - 12 * s)} ${f(y - 2 * s)} ${f(x + 8 * s)} ${f(y - 3 * s)} ${f(x + 19 * s)} ${f(y - 8 * s)} C${f(x + 18 * s)} ${f(y + 14 * s)} ${f(x + 6 * s)} ${f(y + 24 * s)} ${f(x - 6 * s)} ${f(y + 23 * s)} C${f(x - 18 * s)} ${f(y + 21 * s)} ${f(x - 25 * s)} ${f(y + 8 * s)} ${f(x - 25 * s)} ${f(y - 7 * s)} Z`;
    return `<clipPath id="${cid}"><path d="${o}"/></clipPath><path d="${o}" fill="${C.mouth}"/>
      <g clip-path="url(#${cid})"><ellipse cx="${f(x - 3 * s)}" cy="${f(y + 24 * s)}" rx="${f(17 * s)}" ry="${f(11 * s)}" fill="${C.tongue}"/>
      <path d="M${f(x - 26 * s)} ${f(y - 9 * s)} C${f(x - 12 * s)} ${f(y - 3 * s)} ${f(x + 8 * s)} ${f(y - 4 * s)} ${f(x + 20 * s)} ${f(y - 10 * s)} L${f(x + 18 * s)} ${f(y - 1 * s)} C${f(x + 6 * s)} ${f(y + 3 * s)} ${f(x - 12 * s)} ${f(y + 4 * s)} ${f(x - 24 * s)} ${f(y - 1 * s)} Z" fill="${C.teeth}"/></g>
      ${brush([[x - 28 * s, y - 10 * s], [x - 27 * s, y - 7 * s], [x - 26 * s, y - 5 * s], [x - 24 * s, y - 3 * s]], 1, 3 * s, 1, C.mouth, 'opacity=".6"')}`;
  }

  /* ---------- shared defs ---------- */
  const defs = `
    ${[2, 3, 4, 6, 8, 10, 12, 16, 24, 40, 60].map(b => `<filter id="blur${b}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${b}"/></filter>`).join('')}

  }
  /* a string of warm bulbs hanging between two points with a sag */
  function lightString(a, b, sag, n, o = {}) {
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + sag];
    const c1 = [a[0] + (mid[0] - a[0]) * .9, mid[1]], c2 = [b[0] - (b[0] - mid[0]) * .9, mid[1]];

    const cols = o.cols || ['#ffd27a', '#ffb45c', '#fff0c2', '#ff9f8a', '#ffd27a'];
    for (let i = 1; i < n; i++) {
      const p = ART.cubic(a, c1, c2, b, i / n), c = cols[i % cols.length], s = o.s || 1;
      out.push(`<g transform="translate(${f(p[0])} ${f(p[1])}) scale(${s})"><circle class="bulb" style="--d:${f((i * .37) % 3)}s" cy="9" r="22" fill="${c}" opacity=".28" filter="url(#blur8)"/>

  /* a paper lantern hanging from a thread */
  function lantern(x, y, s, col, colD, thread = 60) {

  /* a terracotta pot with a leafy plant; base centre at the origin */
  function plant(seed, s = 1, flowers = '#ff6f7d', noPot = false) {
    const R = rng(seed), leaves = [];
    for (let i = 0; i < 16; i++) {
      const a = -150 + R() * 120, L = 60 + R() * 70, x0 = (R() - .5) * 30, y0 = -70;

  const sceneDefs = `

  /* ---------- characters as composed for a page ---------- */

  /* ---------- the cover ---------- */

        <text x="92" y="226" font-size="32" font-weight="600" fill="#e8ebff">A story for the 15th of Sha&#8217;ban</text>

  /* ---------- page 1: through the window at dusk, hanging the lights the night before ---------- */
  function page1() {

      C${f(a3[0] + 4)} ${f(a3[1] + 120)} ${f(e1[0] + 6)} ${f(e1[1] - 120)} ${f(e1[0])} ${f(e1[1])} C${f(e1[0] - 6)} ${f(e1[1] + 90)} ${f(coilC[0] + 4)} ${f(coilC[1] - 150)} ${f(coilC[0])} ${f(coilC[1])}`;

        <g transform="translate(1340 330)"><rect x="-74" y="-60" width="148" height="128" rx="6" fill="#8a5a2b"/><rect x="-62" y="-48" width="124" height="104" fill="#22305e"/>
          <ellipse cx="0" cy="-6" rx="70" ry="60" fill="#ffd27a" opacity=".25" filter="url(#blur12)"/>
          <path d="M-30 30 C-34 0 -18 -24 0 -32 C18 -24 34 0 30 30 Z" fill="#f0b43c"/><path d="M-12 -20 C-6 -26 6 -26 12 -20" stroke="#fff3c4" stroke-width="3" fill="none"/>
          <rect x="-1.5" y="-46" width="3" height="14" fill="#f0b43c"/><rect x="-46" y="-20" width="8" height="50" fill="#f0b43c"/><rect x="38" y="-20" width="8" height="50" fill="#f0b43c"/>

  /* ---------- the inside cover (endpaper): folded paper stars scattered over the night ---------- */
  function endpaper() {
    const pid = nid('ep'), R = rng(41);

        bits.push(`<g transform="translate(${f(x + dx)} ${f(y + dy)}) rotate(${f(a)})" opacity=".9">${PO.star(r, c)}</g>`);

    }
    for (let i = 0; i < 14; i++) bits.push(`<circle cx="${f(R() * tile)}" cy="${f(R() * tile)}" r="${f(1 + R() * 1.6)}" fill="#fff4cf" opacity="${f(.35 + R() * .4)}"/>`);

/* How Do You Wrap a Kindness?: the pages in book order (cover, inside cover, title page, story pages). */

<script>
/* each page is drawn fresh wherever it appears, so no two copies share SVG ids */
function pageHTML(p) {
  if (!p) return '<div class="blank"></div>';
  const panel = p.text ? `<div class="text" style="left:${p.panel.left}%;top:${p.panel.top}%;width:${p.panel.width}%;${p.panel.css || ''}">${p.text.map(t => `<p>${t}</p>`).join('')}</div>` : '';
  return `<section class="page" aria-label="${p.label}">${p.art()}${panel}</section>`;
}

const app = document.querySelector('.app'), bookEl = document.getElementById('book'), slotL = document.getElementById('slotL'), slotR = document.getElementById('slotR');
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next'), phoneText = document.getElementById('phoneText');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sheet mode for the print renders ---------- */
const sheetId = location.hash.startsWith('#sheet-') ? location.hash.slice(7) : null;
if (sheetId) {
  document.body.classList.add('sheet');
  const p = PAGES.find(q => q.id === sheetId) || PAGES[0];
  app.insertAdjacentHTML('beforeend', `<div class="sheet-page">${pageHTML(p)}</div>`);
}

/* ---------- the book ----------
   Two pages: spread k shows pages 2k-1 (left) and 2k (right); spread 0 is the closed front cover.
   One page: position i shows page i. */
let mode = 'spread', pos = 0, busy = false;
/* where this reader left off, kept per book: the books can share one site (one origin) */
const POS_KEY = 'book-pos:' + document.title;
const lastSpread = Math.floor(PAGES.length / 2);
const spread = k => k === 0 ? [null, PAGES[0]] : [PAGES[2 * k - 1] || null, PAGES[2 * k] || null];
const visible = () => mode === 'spread' ? spread(pos) : [null, PAGES[pos]];
const maxPos = () => mode === 'spread' ? lastSpread : PAGES.length - 1;

function fill(slot, p, spineSide, hide = false) {
  slot.innerHTML = hide ? '' : pageHTML(p) + `<div class="fold ${spineSide}"></div>`;
  slot.classList.toggle('empty', hide);
}
function render() {
  const [l, r] = visible();
  bookEl.classList.toggle('closed', mode === 'spread' && pos === 0);
  bookEl.classList.toggle('single', mode === 'single');
  slotL.hidden = mode === 'single';
  if (mode === 'spread') fill(slotL, l, 'sR', pos === 0);
  fill(slotR, r, 'sL');
  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === maxPos();
  const txt = document.body.classList.contains('small') && r && r.text ? r.text : null;
  phoneText.hidden = !txt;
  phoneText.innerHTML = txt ? txt.map(t => `<p>${t}</p>`).join('') : '';
  try { localStorage.setItem(POS_KEY, JSON.stringify({ mode, pos })); } catch (e) { /* storage is optional */ }
}

/* sizes: two facing pages when each can be at least 560 px wide, otherwise one page at a time. Where two fit, the
   reader can still choose one page at a time (the corner switch): the page fills the window and the text is bigger.
   The choice is kept for all the books, since it is about the reader's eyes, not the book. */
const VIEW_KEY = 'book-view', viewBtn = document.getElementById('view');
const credit = document.getElementById('credit');
let onePage = false;
try { onePage = localStorage.getItem(VIEW_KEY) === 'one'; } catch (e) { /* storage is optional */ }
function layout() {
  const arrows = 2 * 48, fullW = document.documentElement.clientWidth - 32, availH = Math.max(240, window.innerHeight - 40 - (credit.offsetHeight + 16));
  const two = Math.min((fullW - arrows) / 2, availH * 1.4142), fits = two >= 560;
  viewBtn.hidden = !fits;
  document.body.classList.toggle('one-page', fits && onePage);
  viewBtn.setAttribute('aria-label', onePage ? 'Two pages' : 'One page at a time');
  viewBtn.title = onePage ? 'Two pages' : 'One page at a time';
  if (fits && !onePage) mode = 'spread';
  else { if (mode === 'spread') pos = pos === 0 ? 0 : 2 * pos - 1; mode = 'single'; }
  if (mode === 'spread' && document.body.dataset.mode === 'single') pos = pos === 0 ? 0 : Math.floor((pos + 1) / 2);
  document.body.dataset.mode = mode;
  const small = mode === 'single' && Math.min(fullW - arrows, availH * 1.4142) < 520;
  const pw = Math.floor(mode === 'spread' ? two : Math.min(small ? fullW : fullW - arrows, availH * 1.4142));
  const root = document.documentElement.style;
  root.setProperty('--pw', pw + 'px');
  root.setProperty('--ph', Math.round(pw / 1.4142) + 'px');
  root.setProperty('--bookw', (mode === 'spread' ? 2 * pw : pw) + 'px');
  document.body.classList.toggle('small', small);
  /* held sideways, put the text beside the page when there is room for a column of it */
  document.body.classList.toggle('side', small && window.innerWidth > window.innerHeight && fullW - pw - 16 >= 260);
}

/* turn one page: a leaf rotates about the spine, darkening as it lifts and lightening as it lands. The new pages are
   drawn first and the turn starts on the frame after, so a heavy page (the 2D art is live SVG) doesn't eat into it. */
function turn(dir) {
  if (busy) return;
  const to = pos + dir;
  if (to < 0 || to > maxPos()) return;
  if (reduceMotion) { pos = to; render(); return; }
  busy = true;
  const timing = { duration: 900, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' };
  const leaf = document.createElement('div');
  let front, back, from = 0, toAngle, frontSide = 'sL', backSide = 'sR', cover = false;
  if (mode === 'spread') {
    const cur = spread(pos), nxt = spread(to);
    if (dir > 0) { leaf.className = 'leaf fwd'; front = cur[1]; back = nxt[0]; toAngle = -180; fill(slotR, nxt[1], 'sL'); }
    else { leaf.className = 'leaf bwd'; front = cur[0]; back = nxt[1]; toAngle = 180; frontSide = 'sR'; backSide = 'sL'; fill(slotL, nxt[0], 'sR', to === 0); }
    cover = pos === 0 || to === 0;
  } else {
    leaf.className = 'leaf fwd';
    if (dir > 0) { front = PAGES[pos]; back = null; toAngle = -180; fill(slotR, PAGES[to], 'sL'); }
    else { front = PAGES[to]; back = null; from = -180; toAngle = 0; }
  }
  leaf.innerHTML = `<div class="face f">${pageHTML(front)}<div class="fold ${frontSide}"></div><div class="dim"></div></div>` +
    `<div class="face b">${pageHTML(back)}<div class="fold ${backSide}"></div><div class="dim"></div></div>`;
  leaf.style.transform = `rotateY(${from}deg)`;
  bookEl.appendChild(leaf);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (cover) {
      bookEl.classList.remove('closed');
      bookEl.animate([{ transform: pos === 0 ? 'translateX(-25%)' : 'none' }, { transform: to === 0 ? 'translateX(-25%)' : 'none' }], timing);
    }
    const anim = leaf.animate([{ transform: `rotateY(${from}deg)` }, { transform: `rotateY(${toAngle}deg)` }], timing);
    const [dimF, dimB] = leaf.querySelectorAll('.dim'), lift = [{ opacity: 0 }, { opacity: .45, offset: .5 }, { opacity: .45 }], land = [{ opacity: .45 }, { opacity: .45, offset: .5 }, { opacity: 0 }];
    dimF.animate(from === 0 ? lift : land, timing);
    dimB.animate(from === 0 ? land : lift, timing);
    anim.finished.then(() => {
      pos = to;
      bookEl.getAnimations().forEach(a => a.cancel());
      render();
      leaf.remove();
      busy = false;
    });
  }));
}

prevBtn.addEventListener('click', () => turn(-1));
nextBtn.addEventListener('click', () => turn(1));
/* one page at a time (phones), the page turns both ways: a tap on its left third goes back, anywhere else forward,
   as in e-readers; with two pages, each page turns its own way */
slotR.addEventListener('click', e => {
  const r = slotR.getBoundingClientRect();
  turn(mode === 'single' && e.clientX - r.left < r.width / 3 ? -1 : 1);
});
slotL.addEventListener('click', () => turn(-1));
/* full screen: the whole page (book on its cloth) fills the screen; the book grows to fit */
const fsBtn = document.getElementById('fs'), fsRoot = document.documentElement;
const inFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
fsBtn.hidden = !!sheetId || !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFs() {
  try {
    const p = inFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                     : (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot);
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* full screen is optional */ }
}
function fsChanged() {
  const on = inFs();
  document.body.classList.toggle('fullscreen', on);
  fsBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
  fsBtn.title = on ? 'Exit full screen (F)' : 'Full screen (F)';
}
fsBtn.addEventListener('click', toggleFs);
viewBtn.addEventListener('click', () => {
  if (busy) return;
  onePage = !onePage;
  try { localStorage.setItem(VIEW_KEY, onePage ? 'one' : 'two'); } catch (e) { /* storage is optional */ }
  layout(); render();
});
document.addEventListener('fullscreenchange', fsChanged);
document.addEventListener('webkitfullscreenchange', fsChanged);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') turn(1);
  else if (e.key === 'ArrowLeft') turn(-1);
  else if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey && !fsBtn.hidden) toggleFs();
});
let sx = null;
bookEl.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
bookEl.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) turn(dx < 0 ? 1 : -1); sx = null; });
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!busy) { layout(); render(); } }, 150); });

/* ---------- start closed on the cover, at the page a #p<n> link names, or where this reader left off ---------- */
if (!sheetId) {
  layout();
  const named = PAGES.findIndex(p => '#' + p.id === location.hash);
  if (named >= 0) pos = mode === 'spread' ? Math.floor((named + 1) / 2) : named;
  else {
    try { const s = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); if (s && s.mode === mode && s.pos >= 0 && s.pos <= maxPos()) pos = s.pos; } catch (e) { /* storage is optional */ }
  }
  render();
}
addEventListener('beforeprint', () => { document.getElementById('printset').innerHTML = PAGES.map(p => `<div class="sheet-page">${pageHTML(p)}</div>`).join(''); });
</script>
</body>
</html>
